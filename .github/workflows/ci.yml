name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax check
        run: |
          python -m py_compile scripts/index_skills.py

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check requirements
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt --dry-run 2>&1 | grep -i error || echo "Dependencies OK"
          else
            echo "No requirements.txt found"
          fi
